name: bus_daocheng
description: 公車報站與導乘 Flutter multiplatform application
publish_to: none
version: 0.0.6+49
environment:
  sdk: ^3.14.0
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  material_ui: ^1.1.0
  audioplayers: ^6.8.1
  shared_preferences: ^2.5.6
  file_selector: ^1.1.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/phone/
    - assets/phone/audio/
    - assets/phone/lihao_welcome/
    - assets/phone/baolu/
    - assets/phone/baolu_stations/
    - assets/phone/baolu_audio.json
    - assets/phone/bells/
    - assets/phone/catalog/
    - assets/phone/external/
    - assets/phone/maps/
