name: Build and deploy web
on:
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
jobs:
  web:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Flutter
        run: |
          git clone --depth 1 --branch 3.50.0 https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - name: Build website
        working-directory: flutter_app
        run: |
          flutter pub get
          flutter build web --release --base-href /BusDaocheng/app/
      - name: Assemble Pages site
        run: |
          mkdir -p site/app site/assets
          cp index.html style.css site/
          cp assets/icon.png assets/playback.png site/assets/
          cp -R flutter_app/build/web/. site/app/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

